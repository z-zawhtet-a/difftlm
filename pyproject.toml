[project]
name = "vocal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "auraloss>=0.4.0",
    "flax>=0.12.7",
    "imageio-ffmpeg>=0.6.0",
    "jax[cuda13]>=0.10.1",
    "librosa>=0.11.0",
    "matplotlib>=3.11.2",
    "optax>=0.2.8",
    "orbax>=0.1.9",
    "pytest>=9.0.3",
    "swift-f0>=0.3.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "tqdm>=4.70.1",
    "tyro>=1.0.13",
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
